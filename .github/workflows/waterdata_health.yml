name: USGS Water Data API health check

on:
  schedule:
    - cron: '0 12 1 * *'   # first of every month at noon UTC
  workflow_dispatch:        # allow manual trigger at any time

jobs:
  check-waterdata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dataretrieval
        run: pip install dataretrieval

      - name: Test monitoring location query
        id: location_query
        run: |
          python - <<'EOF'
          import dataretrieval.waterdata as waterdata
          gdf, _ = waterdata.get_monitoring_locations(monitoring_location_id='USGS-05331000')
          assert not gdf.empty, "Empty response from get_monitoring_locations"
          print("get_monitoring_locations OK:", gdf['monitoring_location_name'].tolist())
          EOF

      - name: Test daily-values query
        id: daily_query
        run: |
          python - <<'EOF'
          import dataretrieval.waterdata as waterdata
          df, _ = waterdata.get_daily(
              monitoring_location_id='USGS-05331000',
              parameter_code='00060',
              time='2020-01-01/2020-01-03',
          )
          assert not df.empty, "Empty response from get_daily"
          print("get_daily OK:", len(df), "rows")
          EOF

      - name: File issue if Water Data API failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🔥 USGS Water Data API health check failed';

            // Avoid duplicate issues: check for an existing open issue with the same title
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'waterdata-api',
            });
            if (existing.data.some(i => i.title === title)) {
              core.info('Issue already open, skipping creation.');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              labels: ['waterdata-api', 'bug'],
              body: [
                '## USGS Water Data API health check failed',
                '',
                'The monthly service health check detected that one or both of the',
                '`dataretrieval.waterdata` calls used by `v.in.waterdata` are no longer working:',
                '',
                '- `waterdata.get_monitoring_locations()` — site metadata',
                '- `waterdata.get_daily()` — daily values',
                '',
                '## What to check',
                '',
                '1. Review the [dataretrieval-python releases]',
                '   (https://github.com/DOI-USGS/dataretrieval-python/releases) for',
                '   breaking changes to `waterdata` function signatures or returned columns.',
                '2. Check the [USGS Water Data API status](https://waterdata.usgs.gov/blog/api_catalog/)',
                '   for service announcements or endpoint changes.',
                '3. Update `fetch_sites()`, `write_timeseries()`, or other functions in',
                '   `v.in.waterdata.py` as needed to match the new API.',
                '',
                '## References',
                '',
                '- [dataretrieval-python releases](https://github.com/DOI-USGS/dataretrieval-python/releases)',
                '- [USGS Water Data API](https://waterdata.usgs.gov/blog/api_catalog/)',
                '- [Workflow run that triggered this issue](' +
                  `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              ].join('\n'),
            });
